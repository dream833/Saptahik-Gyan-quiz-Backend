<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download App</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f0f0f, #232323);
            font-family: Arial, sans-serif;
        }

        .card {
            text-align: center;
            background: #1c1c1c;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0px 0px 25px rgba(0,0,0,0.4);
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h1 {
            color: #fff;
            margin-bottom: 10px;
        }

        p {
            color: #ccc;
        }

        .btn {
            background: #00c853;
            color: #fff;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 25px;
        }

        .btn:hover {
            background: #00e676;
        }
    </style>
</head>
<body>

    <div class="card">
        
        <img src="logo.png" alt="App Logo" class="logo">

        <h1>Download Our App</h1>
        <p>Get the latest version of our Android application.</p>

      
        <a class="btn" href="https://drive.google.com/file/d/1rr02vn17-k_CgsbgBmdkVXvAfav8Oj4c/view?usp=drivesdk" download>Download APK</a>
    </div>

</body>
</html>
